name: Test nonexistent project fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # URL without https:// prefix is accepted by the parser; the user does not exist
          project-url: github.com/users/actionchain-nonexistent-user-zz9q8x7/projects/999999
          github-token: ${{ github.token }}
          item-id: PVTI_fake
          field-keys: Status,Points
          field-values: Done,3
      - name: Assert action failed on unresolvable project
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent project"
            exit 1
          fi
          echo "PASS: action failed on nonexistent project"
