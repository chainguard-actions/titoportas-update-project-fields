name: Test unsupported owner type in project URL fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-url: https://github.com/enterprises/some-enterprise/projects/1
          github-token: ${{ github.token }}
          item-id: PVTI_fake
          field-keys: Status
          field-values: Done
      - name: Assert action failed on unsupported owner type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported owner type"
            exit 1
          fi
          echo "PASS"
